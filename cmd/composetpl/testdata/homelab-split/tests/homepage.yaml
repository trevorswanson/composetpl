services:
  homepage-smoke-test:
    image: busybox:1.37
    command: ["wget", "-q", "-O", "/dev/null", "http://homepage:3000"]
    networks:
      - proxy
    x-composetpl:
      hook: test
      no-deps: true
      # homepage can take a few seconds to answer after a restart.
      retries: 3
      backoff: 5s
      timeout: 1m
