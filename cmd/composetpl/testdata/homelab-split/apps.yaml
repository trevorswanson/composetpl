services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      TZ: "America/Chicago"
      HOMEPAGE_ALLOWED_HOSTS: "homepage.home.example.com"
    volumes:
      - "/opt/appdata/homepage:/app/config"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.homepage.rule: "Host(`homepage.home.example.com`)"
      traefik.http.routers.homepage.entrypoints: websecure
      traefik.http.routers.homepage.tls.certresolver: letsencrypt
      traefik.http.services.homepage.loadbalancer.server.port: "3000"
    depends_on:
    - traefik
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: "America/Chicago"
      PUID: "1000"
      PGID: "1000"
      VERSION: "docker"
    volumes:
      - "/opt/appdata/plex:/config"
      - "/mnt/media:/media"
    labels:
      homepage.group: "Media"
      homepage.name: "Plex"
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      TZ: "America/Chicago"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "/opt/appdata/radarr:/config"
      - "/mnt/media/movies:/movies"
      - "/mnt/media/downloads:/downloads"
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.radarr.rule: "Host(`radarr.home.example.com`)"
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.routers.radarr.tls.certresolver: letsencrypt
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
      
      homepage.group: "Arr"
      homepage.name: "Radarr"
      homepage.href: "https://radarr.home.example.com"
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      TZ: "America/Chicago"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - "/opt/appdata/sonarr:/config"
      - "/mnt/media/tv:/tv"
      - "/mnt/media/downloads:/downloads"
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.sonarr.rule: "Host(`sonarr.home.example.com`)"
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls.certresolver: letsencrypt
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
      
      homepage.group: "Arr"
      homepage.name: "Sonarr"
      homepage.href: "https://sonarr.home.example.com"
