global:
  tz: America/Chicago
  puid: 1000
  pgid: 1000
  domain: home.example.com
  network: proxy
  certResolver: letsencrypt
  restart: unless-stopped
  configRoot: /opt/appdata
  mediaRoot: /mnt/media

traefik:
  enabled: true
  image: traefik
  tag: v3.5
  acmeEmail: admin@example.com

# One service is rendered per enabled app, using common.service.
apps:
  plex:
    enabled: true
    image: lscr.io/linuxserver/plex
    network_mode: host
    env:
      VERSION: docker
    volumes:
      - "{{ .Values.global.mediaRoot }}:/media"
    homepage:
      group: Media

  sonarr:
    enabled: true
    image: lscr.io/linuxserver/sonarr
    volumes:
      - "{{ .Values.global.mediaRoot }}/tv:/tv"
      - "{{ .Values.global.mediaRoot }}/downloads:/downloads"
    ingress:
      port: 8989
    homepage:
      group: Arr

  radarr:
    enabled: true
    image: lscr.io/linuxserver/radarr
    volumes:
      - "{{ .Values.global.mediaRoot }}/movies:/movies"
      - "{{ .Values.global.mediaRoot }}/downloads:/downloads"
    ingress:
      port: 7878
    homepage:
      group: Arr

  jellyfin:
    enabled: false
    image: lscr.io/linuxserver/jellyfin
    ingress:
      port: 8096

  homepage:
    enabled: true
    image: ghcr.io/gethomepage/homepage
    skipIds: true
    config: false
    env:
      HOMEPAGE_ALLOWED_HOSTS: "homepage.{{ .Values.global.domain }}"
    volumes:
      - "{{ .Values.global.configRoot }}/homepage:/app/config"
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ingress:
      port: 3000
    # Anything under extra is copied into the service verbatim.
    extra:
      depends_on:
        - traefik
